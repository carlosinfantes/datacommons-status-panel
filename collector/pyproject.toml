[project]
name = "dc-status"
version = "1.0.0rc6"
description = "Status collector for Data Commons Platform deployments"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "google-auth>=2.35",
    "requests>=2.32",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_status"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# The formatter owns line length; what is left over is long strings and URLs.
ignore = ["E501"]
