[project]
name = "dc-status"
version = "0.1.0"
description = "Status collector for Data Commons Platform deployments"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "google-auth>=2.35",
    "requests>=2.32",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_status"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
