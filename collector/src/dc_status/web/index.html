<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Commons — platform status</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="preload" href="/static/fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
    <!-- Not deferred: it applies the stored theme before the first paint, then
         waits for the document before building anything. -->
    <script src="/static/app.js"></script>
  </head>
  <body>
    <div class="readout" id="readout">
      <!-- Identity, the snapshot's age and the controls. The verdict below is the
           page's heading, so nothing labels it from above. -->
      <header class="bar">
        <p class="bar__identity">
          <span class="bar__site">Data Commons</span>
          <span class="bar__deployment" id="deployment">—</span>
          <span class="bar__version" id="version"></span>
        </p>
        <p class="bar__age" id="age">
          <span class="bar__clock" id="clock">—</span>
          <span class="bar__relative" id="relative">reading</span>
          <span class="bar__auto">auto-refresh <span class="bar__figure">60 s</span></span>
        </p>
        <div class="bar__controls">
          <fieldset class="theme" id="theme">
            <legend class="visually-hidden">Theme</legend>
            <label class="theme__option">
              <input type="radio" name="theme" value="system" checked />
              <span>System</span>
            </label>
            <label class="theme__option">
              <input type="radio" name="theme" value="light" />
              <span>Light</span>
            </label>
            <label class="theme__option">
              <input type="radio" name="theme" value="dark" />
              <span>Dark</span>
            </label>
          </fieldset>
          <button id="refresh" type="button" class="button">Refresh</button>
        </div>
      </header>

      <main class="body" id="body" aria-busy="true">
        <!-- Only a change of verdict is worth announcing. The script rewrites this
             region only when its words change, so a refresh that finds the same
             state stays silent. -->
        <header class="verdict" aria-live="polite" aria-atomic="true">
          <h1 class="verdict__headline" id="headline">Reading the platform…</h1>
          <p class="verdict__cause" id="cause"></p>
        </header>

        <nav class="tiles" id="tiles" aria-label="Dimensions" hidden></nav>

        <section class="block" id="findings-block" aria-labelledby="findings-title" hidden>
          <div class="block__head">
            <h2 class="block__title" id="findings-title">Findings</h2>
            <span class="block__meta" id="findings-count"></span>
            <button id="toggle-details" type="button" class="button button--small" aria-expanded="false" aria-controls="findings">
              Show every check
            </button>
          </div>
          <div id="findings"></div>
        </section>

        <div id="dimensions"></div>
      </main>

      <footer class="footnote">
        A snapshot you look at, not an alert that finds you. Detection lives in Cloud
        Monitoring, separately.
        <span class="footnote__build" id="build" hidden></span>
      </footer>
    </div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  </body>
</html>
