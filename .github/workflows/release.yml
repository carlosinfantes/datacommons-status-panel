# A tag `vX.Y.Z` publishes ghcr.io/<owner>/dc-status:X.Y.Z, signed with cosign
# (keyless, through this workflow's OIDC identity) and carrying SLSA build
# provenance and an SBOM. Deployments pin the image by the digest this prints.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dc-status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: collector
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: echo "Pin this image as ${IMAGE}:${GITHUB_REF_NAME#v}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          # A hyphenated tag (v1.0.0-rc.1) is a release candidate, never the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            Image: `${{ env.IMAGE }}:${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}`

            Verify: `cosign verify ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com`

  # The Terraform Registry only lists a module that sits at the root of a repo
  # named terraform-<provider>-<name>. A stable tag copies the module into that
  # mirror and tags it the same; release candidates stay out of the registry.
  # Without the deploy key the job does nothing, so forks do not fail.
  terraform-mirror:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: image
    runs-on: ubuntu-latest
    env:
      MIRROR: ${{ github.repository_owner }}/terraform-google-datacommons-status-panel
      MODULE: infra/dcp/modules/status_panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          DEPLOY_KEY: ${{ secrets.TF_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "TF_MIRROR_DEPLOY_KEY is not set; skipping the registry mirror." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          key="$RUNNER_TEMP/mirror_key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone "git@github.com:${MIRROR}.git" "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git rm -rq --ignore-unmatch .
          cp -R "$GITHUB_WORKSPACE/$MODULE/." .
          cp "$GITHUB_WORKSPACE/LICENSE" .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --allow-empty -m "${GITHUB_REF_NAME}" \
              -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/${MODULE}"
          git tag "$GITHUB_REF_NAME"
          git push origin HEAD:refs/heads/main "refs/tags/${GITHUB_REF_NAME}"
          echo "Module published to ${MIRROR} as ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
