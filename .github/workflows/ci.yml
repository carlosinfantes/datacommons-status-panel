name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --check collector/src/dc_status/web/app.js
      - run: node --test collector/tests/web/app.test.js

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/dcp/modules/status_panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: collector
          platforms: linux/amd64
          push: false
          load: true
          tags: dc-status:ci
      # The image the tests never see: start it replaying the example document
      # and ask it what a browser would. Then once more with the gate closed.
      - name: Smoke test
        run: |
          serve() {
            docker run -d --name panel -p 8080:8080 \
              -v "$PWD/collector/tests/fixtures:/fixtures:ro" \
              -e DCS_REPLAY_FILE=/fixtures/demo.json "$@" dc-status:ci
            curl -fsS -o /dev/null --retry 15 --retry-delay 1 --retry-all-errors localhost:8080/healthz
          }
          code() { curl -s -o /dev/null -w '%{http_code}' "localhost:8080$1"; }

          serve -e DCS_REQUIRE_AUTH=false
          curl -fsS localhost:8080/api/v1/status | jq -e '.schema_version == 2'
          test "$(code /)" = 200
          test "$(code /static/app.js)" = 200
          docker rm -f panel

          serve -e DCS_IAP_AUDIENCE=/projects/1/locations/r/services/s
          test "$(code /api/v1/status)" = 403
          test "$(code /)" = 403
          docker rm -f panel
      # Only what a rebuild or a bump can fix fails the build.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: dc-status:ci
          severity-cutoff: high
          only-fixed: true
          output-format: table
